<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>TreadBridge – Web Flasher</title>
<meta name="description" content="Flash and configure TreadBridge on your ESP32-C6 directly from the browser.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%8F%83%3C/text%3E%3C/svg%3E">
<style>
/* Same design tokens as the TreadBridge web interface on the device */
:root{--bg:#080A0E;--card:#1C2028;--card2:#252A34;--fg:#EBEEF2;--dim:#828A96;--acc:#00C88C;--ok:#3CD26E;--warn:#F0BE28;--bad:#DC4646;--off:#3C4048;--line:#323842}
*{box-sizing:border-box}
html{background:var(--bg)}
body{margin:0 auto;max-width:760px;background:var(--bg);color:var(--fg);font:15px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding:12px 12px 84px}
h1{font-size:1.1rem;margin:2px 0 10px;display:flex;justify-content:space-between;align-items:baseline;gap:8px}
h1 small{font-size:.75rem;color:var(--dim);font-weight:400;text-align:right}
h2{font-size:1rem;margin:0 0 6px}
a{color:var(--acc)}
.page{display:none}.page.on{display:block}
.card{background:var(--card);border-radius:14px;padding:12px;margin-bottom:10px}
.lbl{font-size:.7rem;letter-spacing:.06em;color:var(--dim);text-transform:uppercase}
.big{font-size:1.15rem;font-weight:600;word-break:break-word}
.sub{font-size:.8rem;color:var(--dim)}
.hint{font-size:.78rem;color:var(--dim);margin:6px 0}
.ind{display:flex;align-items:center;gap:10px}
.dot{width:14px;height:14px;border-radius:50%;background:var(--off);flex:none}
.dot.ok{background:var(--ok)}.dot.warn{background:var(--warn)}.dot.bad{background:var(--bad)}
.step{display:inline-flex;align-items:center;justify-content:center;width:22px;height:22px;border-radius:50%;background:var(--acc);color:#04130d;font-size:.78rem;font-weight:700;margin-right:8px}
button,.b{font:inherit;font-weight:600;border:0;border-radius:10px;padding:10px 14px;background:var(--acc);color:#04130d;cursor:pointer;text-decoration:none;display:inline-block}
button.s,.b.s{background:var(--card2);color:var(--fg)}
button.r{background:var(--bad);color:#fff}
button:disabled{opacity:.4;cursor:default}
.btns{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px;align-items:center}
label{display:block;font-size:.8rem;color:var(--dim);margin:10px 0 3px}
input[type=text],input[type=password],select{width:100%;font:inherit;color:var(--fg);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
input:focus,select:focus{outline:2px solid var(--acc);outline-offset:-1px}
.chk{display:flex;align-items:center;gap:8px;margin-top:12px;color:var(--fg);font-size:.9rem}
.chk input{width:18px;height:18px;accent-color:var(--acc)}
.warnbox{border-left:4px solid var(--warn)}
.badbox{border-left:4px solid var(--bad)}
.okbox{border-left:4px solid var(--ok)}
ol{margin:6px 0 0;padding-left:20px}ol li{margin:5px 0}
code{background:var(--bg);border-radius:6px;padding:1px 6px;font-size:.85em}
#term{background:#05070a;border-radius:10px;padding:8px 10px;font:12px/1.5 ui-monospace,Consolas,monospace;height:160px;overflow:auto;white-space:pre-wrap;word-break:break-all;margin-top:10px;color:var(--dim)}
#term .ok{color:var(--ok)}#term .bad{color:var(--bad)}#term .warn{color:var(--warn)}
#nav{position:fixed;left:0;right:0;bottom:0;display:flex;background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
#nav button{flex:1;border-radius:0;background:transparent;color:var(--fg);padding:16px 4px;font-size:.9rem}
#nav button.on{background:var(--acc);color:#04130d}
#lang{width:auto;padding:3px 8px;font-size:.75rem;border-radius:8px}
.hide{display:none!important}
esp-web-install-button:not(:defined) span[slot]{display:none}
esp-web-install-button{--esp-tools-button-color:#00C88C;--esp-tools-button-text-color:#04130d}
</style>
</head>
<body>

<h1><span>TreadBridge <span style="color:var(--dim);font-weight:400">· Web Flasher</span></span>
  <small><select id="lang"><option value="en">English</option><option value="de">Deutsch</option></select> <span id="ver"></span></small></h1>

<!-- ============ PAGE: SETUP (settings + flash + apply) ============ -->
<div class="page on" id="p-flash">

  <div class="card badbox hide" id="noSerial">
    <div class="big" data-i="nosupport_t"></div>
    <div class="hint" data-i="nosupport"></div>
  </div>

  <div class="card warnbox hide" id="noFw">
    <div class="big" data-i="nofw_t"></div>
    <div class="hint" data-i="nofw"></div>
  </div>

  <div class="card">
    <div class="ind"><span class="step">1</span><div><div class="big" data-i="st1_t"></div><div class="sub" data-i="st1_s"></div></div></div>
  </div>

  <div class="card">
    <div class="lbl" data-i="l_lang"></div>
    <label for="lang2" data-i="l_lang2"></label>
    <select id="lang2"><option value="1">English</option><option value="0">Deutsch</option></select>
  </div>

  <div class="card">
    <div class="lbl" data-i="l_prof"></div>
    <label for="pn1" data-i="l_pn1"></label><input type="text" id="pn1" maxlength="8" autocomplete="off" value="Person 1">
    <label for="pn2" data-i="l_pn2"></label><input type="text" id="pn2" maxlength="8" autocomplete="off" value="Person 2">
    <label for="fpbase" data-i="l_fpbase"></label><input type="text" id="fpbase" maxlength="14" autocomplete="off" value="TreadBridge">
    <div class="hint"><span data-i="l_fpname"></span> <b id="fpFull"></b></div>
  </div>

  <div class="card">
    <div class="lbl" data-i="l_wlan"></div>
    <label for="wssid" data-i="l_ssid"></label><input type="text" id="wssid" maxlength="32" autocomplete="off">
    <label for="wpass" data-i="l_pass"></label><input type="password" id="wpass" maxlength="63" autocomplete="new-password">
    <label for="host" data-i="l_host"></label><input type="text" id="host" maxlength="24" autocomplete="off" value="treadbridge">
    <div class="hint" data-i="l_wlan_hint"></div>
  </div>

  <div class="card">
    <div class="lbl" data-i="l_ap"></div>
    <label for="apssid" data-i="l_ssid"></label><input type="text" id="apssid" maxlength="32" autocomplete="off" value="TreadBridge">
    <label for="appass" data-i="l_appass"></label><input type="password" id="appass" maxlength="63" autocomplete="new-password">
    <label class="chk"><input type="checkbox" id="forceap"> <span data-i="l_forceap"></span></label>
  </div>

  <div class="card">
    <div class="ind"><span class="step">2</span><div><div class="big" data-i="st2_t"></div><div class="sub" data-i="st2_s"></div></div></div>
    <ol>
      <li data-i="f1_a"></li>
      <li data-i="f1_b"></li>
    </ol>
    <label class="chk"><input type="checkbox" id="autoApply" checked> <span data-i="st2_auto"></span></label>
    <div class="btns">
      <esp-web-install-button manifest="manifest.json">
        <button slot="activate" data-i="f1_btn"></button>
        <span slot="unsupported" data-i="nosupport_t"></span>
        <span slot="not-allowed" data-i="f1_https"></span>
      </esp-web-install-button>
    </div>
    <div class="hint" data-i="f1_note"></div>
  </div>

  <div class="card">
    <div class="ind"><span class="step">3</span><div><div class="big" data-i="st3_t"></div><div class="sub" data-i="st3_s"></div></div></div>
    <div class="ind" style="margin-top:10px"><div class="dot" id="dDev"></div><div><div class="big" id="devTxt"></div><div class="sub" id="devSub"></div></div></div>
    <div class="btns">
      <button id="bApply" data-i="s_apply_now"></button>
      <button class="s" id="bConnect" data-i="s_connect"></button>
      <button class="s" id="bRead" disabled data-i="s_read"></button>
      <button class="s" id="bClose" disabled data-i="s_close"></button>
    </div>
    <div class="hint" data-i="s_apply_hint"></div>
    <div id="term" aria-live="polite"></div>
  </div>

  <div class="card">
    <div class="lbl" data-i="after_t"></div>
    <ol>
      <li data-i="after_1"></li>
      <li data-i="after_2"></li>
      <li data-i="after_3"></li>
    </ol>
  </div>
</div>

<!-- ============ PAGE: GUIDE ============ -->
<div class="page" id="p-guide">
  <div class="card">
    <div class="lbl" data-i="g_t"></div>
    <ol>
      <li data-i="g_1"></li><li data-i="g_2"></li><li data-i="g_3"></li><li data-i="g_4"></li><li data-i="g_5"></li>
    </ol>
  </div>
  <div class="card">
    <div class="lbl" data-i="g_trouble"></div>
    <ol>
      <li data-i="g_t1"></li><li data-i="g_t2"></li><li data-i="g_t3"></li>
    </ol>
  </div>
  <div class="card">
    <div class="lbl" data-i="g_links"></div>
    <div class="btns">
      <a class="b s" href="https://github.com/Kashiyyy/TreadBridge" target="_blank" rel="noopener">GitHub</a>
      <a class="b s" href="https://github.com/Kashiyyy/TreadBridge#readme" target="_blank" rel="noopener">README</a>
    </div>
  </div>
</div>

<div id="nav">
  <button data-t="flash" class="on" data-i="n_flash"></button>
  <button data-t="guide" data-i="n_guide"></button>
</div>

<script type="module" src="https://unpkg.com/esp-web-tools@10/dist/web/install-button.js?module"></script>

};
let LANG = 'en';   // English is the default; a language chosen by the visitor is remembered
try{ if (localStorage.getItem('tb_lang') === 'de') LANG = 'de'; }catch(e){}
const t = (k, ...a) => { let s = (I[LANG][k] ?? I.en[k] ?? k); a.forEach(v => s = s.replace('%s', v)); return s; };
function applyLang(){
  document.documentElement.lang = LANG;
  document.querySelectorAll('[data-i]').forEach(e => e.textContent = t(e.dataset.i));
  $('lang').value = LANG;
  $('lang2').value = LANG === 'de' ? '0' : '1';   // preselect the device language to match the site language
  renderDev();
}
$('lang').onchange = () => { LANG = $('lang').value; try{localStorage.setItem('tb_lang', LANG)}catch(e){}; applyLang(); };

/* ------------------------------------------------------------ navigation */
function show(x){
  document.querySelectorAll('.page').forEach(p => p.classList.toggle('on', p.id === 'p-' + x));
  document.querySelectorAll('#nav button').forEach(b => b.classList.toggle('on', b.dataset.t === x));
  try{ history.replaceState(null, '', '#' + x) }catch(e){}
}
document.querySelectorAll('#nav button').forEach(b => b.onclick = () => show(b.dataset.t));

/* ------------------------------------------------- environment / firmware */
if (!('serial' in navigator)) $('noSerial').classList.remove('hide');
fetch('manifest.json', {cache:'no-cache'}).then(r => r.json()).then(m => { $('ver').textContent = 'v' + m.version; }).catch(() => {});
fetch('firmware/firmware.bin', {method:'HEAD', cache:'no-cache'}).then(r => { if (!r.ok) throw 0; }).catch(() => $('noFw').classList.remove('hide'));

/* ----------------------------------------------------- serial connection */
let port = null, reader = null, writer = null, rxBuf = '', waiters = [], devState = 'none', fwVer = '';

function log(msg, cls){
  const d = document.createElement('div');
  if (cls) d.className = cls;
  d.textContent = msg;
  $('term').appendChild(d);
  $('term').scrollTop = $('term').scrollHeight;
}
function setDev(state, ver){
  devState = state; if (ver !== undefined) fwVer = ver;
  renderDev();
}
function renderDev(){
  const m = {none:['', 'd_none','d_none_s'], busy:['warn','d_busy',''], ok:['ok','d_ok',''], fail:['bad','d_fail','d_fail_s']}[devState];
  $('dDev').className = 'dot ' + m[0];
  $('devTxt').textContent = t(m[1]) + (devState === 'ok' && fwVer ? ' · v' + fwVer : '');
  $('devSub').textContent = m[2] ? t(m[2]) : '';
  const on = devState === 'ok';
  $('bRead').disabled = !on; $('bApply').disabled = devState === 'busy'; $('bClose').disabled = !port;
  $('bConnect').disabled = devState === 'busy' || !!port;
}

function onLine(line){
  line = line.trim();
  if (!line.startsWith('TB+')) return;
  waiters = waiters.filter(w => { if (line.startsWith(w.prefix)) { w.resolve(line); return false; } return true; });
}
function waitFor(prefixes, ms){
  return new Promise((resolve, reject) => {
    const timer = setTimeout(() => { waiters = waiters.filter(w => !a.includes(w)); reject(new Error('timeout')); }, ms);
    const a = prefixes.map(p => ({prefix:p, resolve:l => { clearTimeout(timer); resolve(l); }}));
    waiters.push(...a);
  });
}
async function readLoop(){
  const dec = new TextDecoder();
  try{
    while (port && port.readable){
      reader = port.readable.getReader();
      try{
        for(;;){
          const {value, done} = await reader.read();
          if (done) break;
          rxBuf += dec.decode(value, {stream:true});
          let i;
          while ((i = rxBuf.indexOf('\n')) >= 0){ onLine(rxBuf.slice(0, i)); rxBuf = rxBuf.slice(i + 1); }
          if (rxBuf.length > 8192) rxBuf = '';
        }
      } finally { reader.releaseLock(); reader = null; }
    }
  } catch(e){ /* device unplugged or restarted */ }
  if (port){ await closePort(true); }
}
async function sendLine(text){
  // Short chunks with tiny pauses keep the device's USB receive buffer from overflowing
  const bytes = new TextEncoder().encode(text + '\n');
  const w = port.writable.getWriter();
  try{
    for (let i = 0; i < bytes.length; i += 64){
      await w.write(bytes.slice(i, i + 64));
      await new Promise(r => setTimeout(r, 12));
    }
  } finally { w.releaseLock(); }
}
async function request(cmd, prefixes, ms = 3000){
  const p = waitFor(prefixes, ms);
  await sendLine(cmd);
  return p;
}
async function closePort(lost){
  const p = port; port = null; waiters = []; rxBuf = '';
  try{ if (reader) await reader.cancel(); }catch(e){}
  try{ if (p) await p.close(); }catch(e){}
  setDev('none', '');
  log(lost ? t('t_lost') : t('t_closed'));
}

// Opens the given port and checks that the TreadBridge firmware answers. Returns true on success.
async function connectPort(p){
  port = p;
  setDev('busy');
  try{
    log(t('t_connecting'));
    await port.open({baudRate:115200});
    try{ await port.setSignals({dataTerminalReady:true, requestToSend:false}); }catch(e){}
    readLoop();
    log(t('t_ping'));
    let pong = null;
    for (let i = 0; i < 4 && !pong; i++){
      try{ pong = await request('TB+PING', ['TB+PONG'], 1500); }catch(e){}
    }
    if (!pong){ log(t('t_nopong'), 'bad'); await closePort(false); setDev('fail'); return false; }
    const ver = pong.slice(8).trim();
    log(t('t_pong', ver), 'ok');
    setDev('ok', ver);
    return true;
  } catch(e){
    log(String(e.message || e), 'bad');
    try{ await closePort(false); }catch(_){}
    setDev('fail');
    return false;
  }
}
async function pickAndConnect(){
  if (!('serial' in navigator)){ $('noSerial').classList.remove('hide'); return false; }
  let p;
  try{ p = await navigator.serial.requestPort(); }
  catch(e){ log(t('t_cancel'), 'warn'); return false; }
  return connectPort(p);
}
$('bConnect').onclick = pickAndConnect;
$('bClose').onclick = () => closePort(false);

/* -------------------------------------------------------- settings form */
function fpFullName(){
  const base = $('fpbase').value.trim();
  const pn = $('pn1').value.trim();
  const room = Math.max(0, 23 - pn.length);
  return (base.slice(0, room) + ' ' + pn).trim() + '  /  ' + (base.slice(0, Math.max(0, 23 - $('pn2').value.trim().length)) + ' ' + $('pn2').value.trim()).trim();
}
['fpbase','pn1','pn2'].forEach(id => $(id).oninput = () => { $('fpFull').textContent = fpFullName(); });
$('fpFull').textContent = fpFullName();

// Remember the non-secret fields in this browser (never the passwords)
const SAVE = ['pn1','pn2','fpbase','wssid','host','apssid'];
try{
  const s = JSON.parse(localStorage.getItem('tb_form') || '{}');
  SAVE.forEach(k => { if (s[k] !== undefined) $(k).value = s[k]; });
  if (s.forceap) $('forceap').checked = true;
}catch(e){}
function rememberForm(){
  try{
    const o = {}; SAVE.forEach(k => o[k] = $(k).value); o.forceap = $('forceap').checked;
    localStorage.setItem('tb_form', JSON.stringify(o));
  }catch(e){}
}

function u8len(s){ return [...s].length; }
function validate(){
  const pn1 = $('pn1').value.trim(), pn2 = $('pn2').value.trim(), fp = $('fpbase').value.trim();
  const host = $('host').value.trim().toLowerCase(), aps = $('apssid').value.trim(), app = $('appass').value;
  if (u8len(pn1) < 1 || u8len(pn1) > 8 || u8len(pn2) < 1 || u8len(pn2) > 8) return t('v_pn');
  if (u8len(fp) < 1 || u8len(fp) > 14) return t('v_fp');
  if (!/^[a-z0-9-]{1,24}$/.test(host)) return t('v_host');
  if (aps.length < 1 || aps.length > 32 || (app.length > 0 && app.length < 8)) return t('v_ap');
  return '';
}

$('bRead').onclick = async () => {
  try{
    log(t('t_read'));
    const line = await request('TB+GET', ['TB+CFG'], 3000);
    const j = JSON.parse(line.slice(7));
    $('pn1').value = j.pn1; $('pn2').value = j.pn2; $('fpbase').value = j.fpbase;
    $('wssid').value = j.wssid; $('host').value = j.host; $('apssid').value = j.apssid;
    $('forceap').checked = !!j.forceap; $('lang2').value = String(j.lang);
    $('wpass').value = ''; $('appass').value = '';
    $('wpass').placeholder = j.hasWpass ? '••••••••' : '';
    $('appass').placeholder = j.hasAppass ? '••••••••' : '';
    $('fpFull').textContent = fpFullName();
    log(t('t_readok'), 'ok');
  }catch(e){ log(t('t_nopong'), 'bad'); }
};

// Sends the form values to the connected device. Returns true if the device accepted them.
async function sendSettings(){
  const err = validate();
  if (err){ log(err, 'bad'); return false; }
  rememberForm();
  const kv = {pn1:$('pn1').value.trim(), pn2:$('pn2').value.trim(), fpbase:$('fpbase').value.trim(),
              wssid:$('wssid').value.trim(), host:$('host').value.trim().toLowerCase(),
              apssid:$('apssid').value.trim(), forceap:$('forceap').checked ? '1' : '0', lang:$('lang2').value};
  if ($('wpass').value) kv.wpass = $('wpass').value;     // only send passwords that were typed
  if ($('appass').value) kv.appass = $('appass').value;
  // encodeURIComponent keeps '+', '&' and '=' inside values safe; the device decodes %XX
  const body = Object.entries(kv).map(([k, v]) => encodeURIComponent(k) + '=' + encodeURIComponent(v)).join('&');
  try{
    log(t('t_send'));
    const line = await request('TB+SET ' + body, ['TB+OK', 'TB+ERR'], 5000);
    if (line.startsWith('TB+ERR')){ log(t('t_err') + line.slice(7), 'bad'); return false; }
    const restart = /"restart":true/.test(line);
    log(restart ? t('t_ok') : t('t_ok2'), 'ok');
    $('wpass').value = ''; $('appass').value = '';
    return true;
  }catch(e){ log(t('t_nopong'), 'bad'); return false; }
}

// Manual button: connects first if needed, then sends the settings
$('bApply').onclick = async () => {
  if (validate()){ log(validate(), 'bad'); return; }
  if (devState !== 'ok' && !(await pickAndConnect())) return;
  await sendSettings();
};

/* ------------------------------------- automatic apply after flashing */
// ESP Web Tools announces its progress with "state-changed" events. When the installation is
// finished we reuse the serial port the user already granted to this site and send the settings.
let autoRunning = false;
async function autoApply(){
  if (autoRunning || !('serial' in navigator)) return;
  autoRunning = true;
  try{
    if (validate()){ log(validate(), 'bad'); return; }
    log(t('t_wait'));
    await new Promise(r => setTimeout(r, 3500));      // the board resets and re-enumerates over USB
    let ok = false;
    for (let attempt = 0; attempt < 6 && !ok; attempt++){
      const ports = await navigator.serial.getPorts();
      for (const p of ports){
        if (p.readable || p.writable) continue;       // still open somewhere else
        log(t('t_auto_start'));
        ok = await connectPort(p);
        if (ok) break;
      }
      if (!ok) await new Promise(r => setTimeout(r, 2500));
    }
    if (ok) await sendSettings();
    else log(t('t_auto_fail'), 'warn');
  } finally { autoRunning = false; }
}
document.querySelector('esp-web-install-button').addEventListener('state-changed', ev => {
  const st = ev.detail && ev.detail.state;
  if (st === 'finished' && $('autoApply').checked) autoApply();
});

/* ---------------------------------------------------------------- start */
applyLang();
renderDev();
const h = (location.hash || '').slice(1);
if (['flash','guide'].includes(h)) show(h);
</script>
