; Laufband-Bridge fuer das Waveshare ESP32-C6-Touch-LCD-1.47 (PlatformIO IDE in VS Code)
; Der ESP32-C6 braucht die pioarduino-Plattform (Arduino-Core 3.x);
; die offizielle espressif32-Plattform unterstuetzt ihn nicht.
[env:esp32c6]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
board = esp32-c6-devkitc-1
framework = arduino
board_upload.flash_size = 8MB
board_build.partitions = huge_app.csv
monitor_speed = 115200
monitor_filters = default, esp32_exception_decoder
upload_speed = 460800
build_flags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DCORE_DEBUG_LEVEL=0
lib_deps =
    h2zero/NimBLE-Arduino@^2.1.0
    mathieucarbou/AsyncTCP@3.3.2
    mathieucarbou/ESPAsyncWebServer@3.6.0
    https://github.com/moononournation/Arduino_GFX.git#v1.6.8
